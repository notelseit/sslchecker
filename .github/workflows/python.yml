name: Python compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install ".[test]"
      - run: python -m compileall -q sslchecker
      - run: python -m pytest tests -q
      - name: Wheel installation smoke test
        shell: bash
        run: |
          python -m venv /tmp/sslchecker-wheel
          /tmp/sslchecker-wheel/bin/python -m pip install dist/*.whl
          /tmp/sslchecker-wheel/bin/sslchecker --help
          /tmp/sslchecker-wheel/bin/python -c "from sslchecker.sslcert import SSLCert; print('wheel import OK')"
