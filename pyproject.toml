[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sslchecker"
version = "0.2.0"
description = "Validate remote TLS certificates"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{name = "Seungho Kim"}]
dependencies = ["click>=8.1", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sslchecker = "sslchecker.cli:cli"

[tool.setuptools.packages.find]
include = ["sslchecker*"]
